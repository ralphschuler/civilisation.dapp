name: Verify and publish Civilization DApp container

on:
  workflow_dispatch:
    inputs:
      publish_master:
        description: Publish the verified master image
        required: true
        default: false
        type: boolean
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_DB: civilization_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d civilization_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/civilization_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify workflow security invariants
        run: pnpm security:workflows
      - name: Validate production and fixture Solidity scope
        run: pnpm security:scope
      - name: Verify offline V1/V2 proxy compatibility and size budgets
        run: pnpm verify:proxy:v2-compatibility
      - name: Record deterministic offline contract-assurance manifest
        env:
          SECURITY_ASSURANCE_REF: ${{ github.sha }}
        run: pnpm security:offline
      - name: Install pinned Slither and Solidity compiler
        run: |
          solc_path="$RUNNER_TEMP/solc-linux-amd64-v0.8.30+commit.73712a01"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$solc_path" \
            https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.30+commit.73712a01
          echo "f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7  $solc_path" | sha256sum --check --strict
          chmod 0755 "$solc_path"
          python3 -m pip install --user --disable-pip-version-check 'slither-analyzer==0.11.3'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run pinned Slither analysis
        run: SOLC_BINARY="$RUNNER_TEMP/solc-linux-amd64-v0.8.30+commit.73712a01" pnpm security:slither
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:demo
      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: |
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Installing Playwright Chromium (attempt $attempt/$max_attempts)"
            if timeout --kill-after=30s 5m pnpm exec playwright install --with-deps chromium; then
              exit 0
            else
              status=$?
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Playwright Chromium installation failed after $max_attempts attempts." >&2
              exit "$status"
            fi

            backoff_seconds=$((attempt * 10))
            echo "Playwright Chromium installation failed; retrying in ${backoff_seconds}s." >&2
            sleep "$backoff_seconds"
          done
      - name: Run WalletAccess browser E2E
        run: pnpm test:e2e:wallet
      - name: Upload WalletAccess E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wallet-access-playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm test:integration:headers
      - run: docker build -t civilization-dapp-test:ci .
      - name: Migration CLI fails safely without database configuration
        run: |
          set +e
          output="$(docker run --rm --entrypoint node civilization-dapp-test:ci scripts/db-migrate.mjs 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = "Database migration failed (database_unavailable). No application process was started."
      - name: Chain-indexer replay CLI fails safely without configuration
        run: |
          expected_output="Chain-indexer replay failed (chain_indexer_replay_failed)."
          set +e
          output="$(docker run --rm --entrypoint node civilization-dapp-test:ci scripts/run-chain-indexer.mjs 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 1 ] || [ "$output" != "$expected_output" ]; then
            printf '%s' "$output" >&2
            exit 1
          fi

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish_master == true)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build candidate production image
        if: github.ref_name == 'master'
        run: docker build -t civilization-dapp-release-gate:ci .
      - name: Gate master delivery against live World Chain V2 runtime
        if: github.ref_name == 'master'
        env:
          CIVILIZATION_ENV: production
          WALLET_AUTH_URL: https://civilization.nyphon.de
          WALLET_AUTH_RATE_LIMIT_SECRET: ${{ secrets.CIVILIZATION_RELEASE_GATE_RATE_LIMIT_SECRET }}
          WALLET_AUTH_TRUSTED_PROXY_HOPS: "1"
          WORLD_APP_ID: ${{ vars.CIVILIZATION_WORLD_APP_ID }}
          CIVILIZATION_CONTRACT_ADDRESS: "0x99976f2f170F17a14ae6c69cEb8Cb31d47366764"
          CIVILIZATION_CHAIN_ID: "480"
          CIVILIZATION_WORLD_TOKEN_ADDRESS: "0x2cFc85d8E48F8EAB294be644d9E25C3030863003"
          CIVILIZATION_WORLDCHAIN_RPC_URL: ${{ secrets.CIVILIZATION_WORLDCHAIN_RPC_URL }}
          CIVILIZATION_WORLDCHAIN_V2_IMPLEMENTATION_ADDRESS: ${{ vars.CIVILIZATION_WORLDCHAIN_V2_IMPLEMENTATION_ADDRESS }}
          CIVILIZATION_WORLDCHAIN_V2_IMPLEMENTATION_CODEHASH: ${{ vars.CIVILIZATION_WORLDCHAIN_V2_IMPLEMENTATION_CODEHASH }}
        run: |
          set -euo pipefail
          name="civilization-release-gate-$RANDOM"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" -p 127.0.0.1::31057 \
            -e CIVILIZATION_ENV -e WALLET_AUTH_URL -e WALLET_AUTH_RATE_LIMIT_SECRET \
            -e WALLET_AUTH_TRUSTED_PROXY_HOPS -e WORLD_APP_ID \
            -e CIVILIZATION_CONTRACT_ADDRESS -e CIVILIZATION_CHAIN_ID \
            -e CIVILIZATION_WORLD_TOKEN_ADDRESS -e CIVILIZATION_WORLDCHAIN_RPC_URL \
            -e CIVILIZATION_WORLDCHAIN_V2_IMPLEMENTATION_ADDRESS \
            -e CIVILIZATION_WORLDCHAIN_V2_IMPLEMENTATION_CODEHASH \
            civilization-dapp-release-gate:ci >/dev/null
          port="$(docker port "$name" 31057/tcp | sed 's/.*://')"
          for attempt in 1 2 3 4 5; do
            payload="$(curl --fail --silent --show-error "http://127.0.0.1:${port}/api/contracts/status")" && break
            sleep 1
          done
          test -n "${payload:-}"
          node -e 'const value = JSON.parse(process.argv[1]); if (value.runtimeVerification?.status !== "verified") process.exit(1)' "$payload"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select explicit release tags
        id: tags
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "release=latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "release=dev" >> "$GITHUB_OUTPUT"
          else
            echo "ref is not a release branch" >&2
            exit 1
          fi
      - name: Publish the verified master image
        if: github.ref_name == 'master'
        run: |
          docker tag civilization-dapp-release-gate:ci ghcr.io/ralphschuler/civilization.dapp:${{ steps.tags.outputs.release }}
          docker tag civilization-dapp-release-gate:ci ghcr.io/ralphschuler/civilization.dapp:${{ github.ref_name }}-${{ github.sha }}
          docker push ghcr.io/ralphschuler/civilization.dapp:${{ steps.tags.outputs.release }}
          docker push ghcr.io/ralphschuler/civilization.dapp:${{ github.ref_name }}-${{ github.sha }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: github.ref_name == 'develop'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ralphschuler/civilization.dapp:${{ steps.tags.outputs.release }}
            ghcr.io/ralphschuler/civilization.dapp:${{ github.ref_name }}-${{ github.sha }}
